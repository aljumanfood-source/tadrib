<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وينك 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17324A; --prim:#2E8BD8; --air:#1F7FC9; --air-soft:#DCEAF4; --bg:#EEF2F5; --card:#FFFFFF;
  --line:#D5DEE5; --muted:#5E7182; --amber:#E3A21A; --amber-soft:#FBF0D6;
  --ok:#2E8B57; --ok-soft:#DDF0E5; --bad:#B83A2E; --bad-soft:#F7E0DD; --text:#15222D;
  --pipe:#C9D5DE;
  --bgimg:radial-gradient(120% 60% at 0% 100%,#DCEEE3 0%,rgba(220,238,227,0) 55%),linear-gradient(165deg,#FFFFFF 0%,#EFF6FC 50%,#DCEAF6 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#CFE2F2; --prim:#3E97DE; --air:#5AA6DA; --air-soft:#1B3347; --bg:#0F1A23; --card:#172532;
    --line:#2A3C4B; --muted:#8FA3B4; --amber:#F0B43A; --amber-soft:#3A2F14;
    --ok:#4FB77E; --ok-soft:#173326; --bad:#E0695C; --bad-soft:#3A1D1A; --text:#E6EEF4; --pipe:#2C4254; --bgimg:none;
  }
}
:root[data-theme="dark"]{
  --ink:#CFE2F2; --prim:#3E97DE; --air:#5AA6DA; --air-soft:#1B3347; --bg:#0F1A23; --card:#172532;
  --line:#2A3C4B; --muted:#8FA3B4; --amber:#F0B43A; --amber-soft:#3A2F14;
  --ok:#4FB77E; --ok-soft:#173326; --bad:#E0695C; --bad-soft:#3A1D1A; --text:#E6EEF4; --pipe:#2C4254; --bgimg:none;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%}
body{margin:0;min-height:100%;background:var(--bgimg,var(--bg));background-attachment:fixed;color:var(--text);
  font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-bottom:86px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--text);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.top{background:rgba(23,37,50,.92)}}
:root[data-theme="dark"] header.top{background:rgba(23,37,50,.92)}
.brand{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-size:1.6rem;font-weight:700;line-height:1;letter-spacing:0}
.brand small{display:block;font-family:"IBM Plex Sans Arabic",sans-serif;font-size:.7rem;font-weight:400;opacity:.75;margin-top:3px}
.role{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:.8rem}
.role select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 8px;max-width:150px}
.role select option{color:#15222D}
.iconbtn{background:none;border:0;color:inherit;padding:6px;border-radius:8px;display:grid;place-items:center}
main{padding:14px}
h1{font-size:1.35rem;margin:4px 0 12px;line-height:1.3}
h2{font-size:1.05rem;margin:22px 0 10px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:600;background:var(--prim);color:#fff;min-height:44px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{background:var(--air);color:#0F1A23}}
.btn.amber{background:var(--amber);color:#1E1606}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--air-soft);color:var(--air);white-space:nowrap}
.chip.amber{background:var(--amber-soft);color:#8A5E00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.amber{color:var(--amber)}}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters select{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px}
/* bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--muted);position:relative}
nav.tabs button[aria-current="page"]{color:var(--air);font-weight:700}
nav.tabs svg{width:24px;height:24px}
.badge{position:absolute;top:4px;inset-inline-end:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:999px;font-size:.68rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
/* the pipe */
.vpipe{position:relative;padding-inline-start:0}
.vstage{display:flex;align-items:center;gap:14px;position:relative;padding:8px 0;background:none;border:0;width:100%;text-align:start}
.vstage .joint{width:46px;height:46px;flex:none;border-radius:50%;background:var(--card);border:5px solid var(--pipe);display:grid;place-items:center;
  font-weight:700;font-size:1rem;position:relative;z-index:2;color:var(--text)}
.vstage.has .joint{border-color:var(--air)}
.vstage.last .joint{border-color:var(--amber)}
.vstage .lbl{flex:1;min-width:0}
.vstage .lbl b{display:block;font-size:.98rem}
.vstage .lbl i{font-style:normal;font-size:.8rem;color:var(--muted)}
.vstage .bar{display:block;height:8px;border-radius:4px;background:var(--air-soft);margin-top:5px;overflow:hidden}
.vstage .bar i{display:block;height:100%;background:var(--air);border-radius:4px}
.vpipe::before{content:"";position:absolute;top:30px;bottom:30px;inset-inline-start:17px;width:12px;border-radius:6px;background:var(--pipe);z-index:1}
.vpipe::after{content:"";position:absolute;top:30px;bottom:30px;inset-inline-start:21px;width:4px;z-index:1;border-radius:2px;
  background:repeating-linear-gradient(to bottom,var(--air) 0 10px,transparent 10px 22px);animation:flow 1.4s linear infinite;opacity:.8}
@keyframes flow{from{background-position:0 0}to{background-position:0 22px}}
/* horizontal pipe for a project */
.hpipe{display:flex;align-items:center;margin:14px 2px 6px}
.hpipe .seg{flex:1;height:10px;background:var(--pipe)}
.hpipe .seg.on{background:var(--air)}
.hpipe .j{width:20px;height:20px;border-radius:50%;background:var(--card);border:4px solid var(--pipe);flex:none}
.hpipe .j.on{border-color:var(--air);background:var(--air)}
.hpipe .j.now{border-color:var(--amber);background:var(--card);width:26px;height:26px;box-shadow:0 0 0 4px var(--amber-soft)}
.stagename{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.stagename b{font-size:1.05rem}
.notesbox{margin:12px 0;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.notesbox .enginp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:46px;margin:8px 0}
.notesbox textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;margin:8px 0}
.note{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.9rem;white-space:pre-wrap}
.note small{display:block;color:var(--muted);font-size:.75rem}
@media (prefers-reduced-motion:reduce){.vpipe::after{animation:none}}
/* lists */
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;width:100%;text-align:start}
.item:last-child{border-bottom:0}
.item.wrap{flex-wrap:wrap;gap:8px}
.itemopen{display:flex;align-items:center;gap:12px;flex:1 1 100%;min-width:0;background:none;border:0;padding:0;text-align:start;color:inherit}
.rowacts{display:flex;gap:8px;flex:1 1 100%;padding-inline-start:52px}
.rowacts .btn{flex:1;min-height:38px;padding:6px 8px;font-size:.9rem}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:auto}
.item .s{font-size:.82rem;color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:10px;background:var(--air-soft);color:var(--air);display:grid;place-items:center;font-weight:700;flex:none}
.back{background:none;border:0;color:var(--air);font-weight:600;padding:6px 0;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.actions3 a,.actions3 button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);text-decoration:none;font-size:.82rem;font-weight:600}
.actions3 svg{width:22px;height:22px;color:var(--air)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem;margin:8px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;direction:auto;text-align:start}
.timeline{list-style:none;margin:8px 0 0;padding:0;border-inline-start:2px solid var(--line)}
.timeline li{padding:0 12px 10px;position:relative;font-size:.86rem}
.timeline li::before{content:"";position:absolute;inset-inline-start:-6px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--air)}
.timeline small{color:var(--muted);display:block}
.seg-tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg-tabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg-tabs button[aria-pressed="true"]{background:var(--prim);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg-tabs button[aria-pressed="true"]{background:var(--air);color:#0F1A23}}
.qty{font-weight:700;font-size:1.1rem}
.qty.low{color:var(--bad)}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,calc(50% - 264px));z-index:15;
  background:var(--amber);color:#1E1606;border:0;border-radius:14px;padding:12px 18px;font-weight:700;box-shadow:0 6px 18px rgba(23,50,74,.25);display:flex;gap:6px;align-items:center}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--amber);width:100%;text-align:start}
.alert.bad{border-inline-start-color:var(--bad)}
.alert b{display:block}
.steps{display:flex;gap:4px;margin:10px 0}
.steps span{flex:1;text-align:center;font-size:.72rem;padding:6px 2px;border-radius:6px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.steps span.on{background:var(--air-soft);color:var(--air);border-color:transparent;font-weight:700}
.steps span.rej{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:700}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:1.1rem}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--prim);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:.9rem;max-width:90%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:var(--air);color:#0F1A23}}
.demo-tag{font-size:.68rem;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:0 5px;margin-inline-start:6px;font-weight:400}
.ltr{direction:ltr;unicode-bidi:isolate}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.lineitems .row{margin-bottom:8px}
.lineitems select{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px}
.lineitems input{width:80px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
.stat b{font-size:1.2rem}
/* login */
.login{position:fixed;inset:0;overflow:auto;z-index:50;display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(14px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(120% 60% at 0% 100%,#DCEEE3 0%,rgba(220,238,227,0) 55%),linear-gradient(165deg,#FFFFFF 0%,#EFF6FC 50%,#DCEAF6 100%);color:#16324A}
.ltop{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:2}
.lbrand{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-weight:700;font-size:2.1rem;line-height:1;color:#1B7CC8;display:flex;align-items:flex-start;gap:4px}
.lbrand i{width:10px;height:10px;border-radius:50%;background:#13803F;display:inline-block;margin-top:4px}
.lapp{width:min(66px,18vw);height:auto;display:block;border-radius:50%;box-shadow:0 6px 16px -6px rgba(2,153,102,.55)}
.llogo{width:min(170px,44vw);height:auto;display:block}
.lmid{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 0;position:relative;z-index:2}
.lcard{width:100%;max-width:380px;background:#FFFFFF;border:1px solid #D3E3F0;border-radius:18px;padding:24px 20px;box-shadow:0 18px 40px -22px rgba(27,124,200,.45)}
.lcard h1{margin:0 0 4px;font-size:1.35rem;color:#16324A}
.lcard p.sub{margin:0 0 20px;color:#5B7389;font-size:.9rem}
.lfield{display:block;margin-bottom:14px}
.lfield span{display:block;font-size:.85rem;color:#5B7389;margin-bottom:5px;font-weight:600}
.lfield .box{display:flex;align-items:center;border:1.5px solid #CFDDEA;border-radius:12px;background:#F8FBFE;overflow:hidden}
.lfield .box:focus-within{border-color:#1B7CC8;background:#fff;box-shadow:0 0 0 3px rgba(27,124,200,.15)}
.lfield input{flex:1;min-width:0;border:0;background:transparent;padding:12px 14px;min-height:48px;font-size:1rem;color:#16324A;outline:none}
.lfield .eye{border:0;background:none;color:#1B7CC8;font-weight:600;font-size:.85rem;padding:0 14px;min-height:48px}
.lbtn{width:100%;border:0;border-radius:12px;min-height:50px;background:#1B7CC8;color:#fff;font-weight:700;font-size:1.05rem;margin-top:6px}
.lbtn:active{background:#156AAD}
.lerr{min-height:1.4em;margin:10px 0 0;color:#B83A2E;font-size:.9rem;text-align:center}
.lwater{position:absolute;inset-inline-end:-40px;bottom:-30px;width:min(330px,80vw);opacity:.07;pointer-events:none;z-index:1}
.lfoot{text-align:center;font-size:.8rem;color:#5B7389;position:relative;z-index:2}
.app.nonav{padding-bottom:20px}
.backbtn{display:flex;align-items:center;gap:2px;background:var(--air-soft);border:0;color:var(--air);border-radius:10px;padding:7px 10px 7px 12px;font-weight:600;font-size:.9rem;min-height:40px}
.backbtn svg{width:18px;height:18px}
header.top .brand{background:none;border:0;padding:6px;display:grid;place-items:center;line-height:0;color:var(--muted);border-radius:10px}
header.top .brand svg{width:24px;height:24px}
header.top .iconbtn{color:var(--muted)}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 16px;margin-bottom:12px;color:var(--text);position:relative}
.tile .tico{width:58px;height:58px;border-radius:14px;background:var(--air-soft);color:var(--air);display:grid;place-items:center;flex:none}
.tile .tico svg{width:30px;height:30px}
.tile b{display:block;font-size:1.15rem;margin-bottom:2px}
.tile .grow span{display:block;font-size:.85rem;color:var(--muted)}
.tile .tarr{color:var(--muted);transform:scaleX(-1);display:grid}
.tile .tarr svg{width:20px;height:20px}
.badge2{background:var(--bad);color:#fff;border-radius:999px;font-size:.75rem;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.logoutbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:18px;background:transparent;border:1.5px solid var(--bad);color:var(--bad);border-radius:14px;min-height:50px;font-weight:700;font-size:1rem}
.logoutbtn svg{width:20px;height:20px}
.bell{position:relative}
.bdot{position:absolute;top:0;inset-inline-end:-2px;background:var(--bad);color:#fff;border-radius:999px;font-size:.66rem;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.circles{display:grid;grid-template-columns:1fr 1fr;justify-items:center;gap:18px 12px;margin:18px 0 8px}
.circles .circ:nth-child(3){grid-column:1 / -1}
.circ{position:relative;width:min(150px,40vw);aspect-ratio:1;border-radius:50%;border:0;color:#fff;
  background:radial-gradient(circle at 35% 30%,#10B57C 0%,#029966 55%,#027E54 100%);
  box-shadow:0 12px 24px -12px rgba(2,120,80,.7),inset 0 -4px 10px rgba(0,0,0,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px}
.circ svg{width:40px;height:40px}
.circ b{font-size:1.05rem;line-height:1.3}
.circ:active{transform:scale(.97)}
.cbadge{position:absolute;top:6%;inset-inline-end:6%;background:#fff;color:var(--bad);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:700;font-size:.9rem;box-shadow:0 2px 6px rgba(0,0,0,.2);padding:0 6px}
.exitbtn{background:var(--bad-soft);color:var(--bad)}
.exitbtn svg{width:18px;height:18px}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;min-height:128px;padding:16px 14px;border-radius:18px;border:0;color:#fff;
  background:radial-gradient(circle at 20% 15%,#10B57C 0%,#029966 55%,#027E54 100%);box-shadow:0 10px 20px -12px rgba(2,120,80,.7)}
.jcard b{font-size:1.02rem;line-height:1.35;min-height:2.7em}
.jcard .jday{font-size:1.9rem;font-weight:700;line-height:1;margin-top:auto}
.jcard .jsub{font-size:.78rem;opacity:.9}
.verse{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid #029966;border-radius:14px;padding:16px;margin-bottom:14px;
  font-family:"Amiri Quran","Amiri","Traditional Arabic","IBM Plex Sans Arabic",serif;font-size:1.3rem;line-height:2.2;color:var(--text)}
.verse small{display:block;font-family:"Amiri Quran","Amiri",serif;font-size:.95rem;color:var(--muted);line-height:1.4;margin-top:6px}
.jstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.jstats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.jstats b{display:block;font-size:1.6rem;color:#029966}
.jstats span{font-size:.8rem;color:var(--muted)}
.jbtn{background:#029966 !important;color:#fff !important;min-height:54px;font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:8px}
.pcount{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pcount div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.pcount b{display:block;font-size:1.6rem;color:#029966}
.pcount span{font-size:.8rem;color:var(--muted)}
.pyr{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:10px}
.prow{display:flex;justify-content:center;gap:10px;width:100%}
.psq{flex:0 1 31%;aspect-ratio:1;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
.psq b{font-size:1.05rem}
.psq span{font-size:.72rem;color:var(--muted);text-align:center}
.psq.done{background:radial-gradient(circle at 25% 20%,#10B57C 0%,#029966 60%,#027E54 100%);border-color:transparent;color:#fff;box-shadow:0 8px 16px -10px rgba(2,120,80,.7)}
.psq.done span{color:#fff;opacity:.92}
.wk{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:.88rem}
.wk td{padding:7px 6px;border-bottom:1px solid var(--line)}
.wk td:last-child{text-align:end;font-weight:700;color:#029966;white-space:nowrap}
.wk tr.tod td{background:var(--ok-soft)}
.wk tr.sum td{font-weight:700;border-bottom:0;border-top:2px solid var(--line)}
.addline{background:#029966 !important;color:#fff !important;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px}
.item .avatar svg{width:20px;height:20px}
.notedit{border:0;background:var(--air-soft);color:var(--air);border-radius:8px;padding:4px 12px;font-weight:600;font-size:.82rem}

/* workshops */
.wthumb{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line)}
.wlist{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.wcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;width:100%;padding:18px 16px 16px;background:var(--card,#fff);border:1px solid var(--line);border-radius:16px;position:relative;box-shadow:0 6px 18px -14px rgba(16,42,67,.35)}
.wcard-chip{position:absolute;inset-inline-start:12px;top:12px}
.wcard-poster{width:104px;height:146px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin-top:4px}
.wcard-avatar{width:76px;height:76px;margin-top:4px}
.wcard-t{font-weight:700;font-size:1.08rem;line-height:1.4;max-width:20ch;margin-top:2px}
.wcard-by{color:var(--muted);font-size:.92rem}
.wcard-when{color:var(--muted);font-size:.85rem}
.wposter{display:block;width:100%;max-height:380px;object-fit:contain;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.wacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.wacts .btn{min-height:46px;font-size:.9rem}
.wtwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.wt{border-collapse:separate;border-spacing:0;width:100%;font-size:.85rem;min-width:640px}
.wt th,.wt td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.wt th{background:var(--air-soft);color:var(--ink);font-weight:600;font-size:.78rem;line-height:1.3}
.wt th small{display:block;font-weight:400;color:var(--muted)}
.wt .nm{text-align:start;font-weight:600;position:sticky;inset-inline-start:0;background:var(--card);z-index:1;box-shadow:-1px 0 0 var(--line)}
.wt th.nm{background:var(--air-soft)}
.wt tbody tr{cursor:pointer}
.wt tbody tr:hover td{background:var(--bg)}
.wt tbody tr:last-child td{border-bottom:0}
.dots{display:flex;gap:3px;justify-content:center;margin-top:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)} .dots i.off{background:var(--bad)}
.wrange{gap:8px;align-items:flex-end} .wrange .field{margin-bottom:8px} .wrdel{min-height:44px;margin-bottom:8px;padding:6px 12px}
.qedit{gap:8px;margin-bottom:6px} .qedit input[type=radio]{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.qedit input:not([type]){flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}
.qlist{margin:6px 0 10px;padding-inline-start:20px;font-size:.9rem} .qlist li.ok{color:var(--ok);font-weight:600}
.dayck{gap:10px;padding:8px 0;border-bottom:1px solid var(--line)} .dayck input{width:20px;height:20px}
.qrbox{background:#fff;padding:14px;border-radius:12px;width:max-content;max-width:100%;margin:4px auto 8px;min-height:60px;display:grid;place-items:center}
/* participant check-in */
.cicard{max-width:440px}
.ciposter{display:block;width:100%;max-height:220px;object-fit:contain;border-radius:12px;margin-bottom:12px;background:#F4F8FB}
.cititle{margin:0 0 2px;font-size:1.3rem;color:#16324A}
.cihead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;position:relative;padding:6px 2px 14px}
.cihead-chip{position:absolute;inset-inline-start:0;top:0}
.cihead-poster{width:150px;height:210px;object-fit:cover;border-radius:14px;border:1px solid #E3ECF3;margin-top:6px}
.cihead-t{margin:6px 0 0;font-size:1.28rem;line-height:1.4;color:#16324A;max-width:22ch}
.cihead-by{margin:0;color:#5B7389;font-size:.98rem}
.cihead-when{margin:0;color:#5B7389;font-size:.9rem}
.cidet{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:8px 0 6px;padding:12px 14px;border-radius:12px;background:#F4F8FB;border:1px solid #E3ECF3;color:#16324A}
.cidet dt{color:#5B7389;white-space:nowrap} .cidet dd{margin:0;font-weight:600;line-height:1.5}
.cih{font-size:1.1rem;margin:0 0 12px;color:#16324A}
.cimuted{color:#5B7389}
.cisug{display:flex;flex-direction:column;gap:6px;max-height:48vh;overflow:auto}
.cisug button,.cibtn2{background:#F4F8FB;border:1px solid #CFDDEA;border-radius:12px;padding:12px 14px;text-align:start;font-weight:600;color:#16324A;min-height:48px;width:100%}
.cibtn2{text-align:center;margin-top:10px}
.cisel{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#EAF4FC;border-radius:12px;padding:12px 14px;margin-bottom:14px;color:#16324A}
.cisel button{background:none;border:0;color:#1B7CC8;font-weight:600;font-size:.85rem;white-space:nowrap}
.cikv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 8px;color:#16324A} .cikv dt{color:#5B7389} .cikv dd{margin:0;font-weight:600}
.cibig{width:100%;min-height:58px;font-size:1.25rem;font-weight:700;border:0;border-radius:14px;background:#2E8B57;color:#fff;margin-top:10px}
.cibig:disabled{opacity:.6}
.ciok{text-align:center;color:#16324A} .ciok p{margin:0 0 6px}
.ciok .mark{width:68px;height:68px;border-radius:50%;background:#DDF0E5;color:#2E8B57;display:grid;place-items:center;margin:4px auto 10px}
.ciok .mark svg{width:34px;height:34px}
.cistaff{background:none;border:0;color:#5B7389;font-size:.85rem;text-decoration:underline;padding:12px;align-self:center;position:relative;z-index:2}
.qq{border:0;padding:0;margin:0 0 16px;color:#16324A} .qq legend{font-weight:600;margin-bottom:8px;padding:0}
.qopt{display:flex;gap:10px;align-items:center;border:1.5px solid #CFDDEA;border-radius:12px;padding:10px 12px;margin-bottom:6px;background:#F8FBFE;cursor:pointer}
.qopt input{width:20px;height:20px;flex:none;accent-color:#1B7CC8}
.qopt:has(input:checked){border-color:#1B7CC8;background:#EAF4FC}
</style>

  return out;
};

const NAV = [];
let HIST = true;
const snap = () => ({tab:UI.tab, cust:UI.cust, req:UI.req, stageF:UI.stageF, cityF:UI.cityF, q:UI.q, incF:UI.incF, invTab:UI.invTab, reqTab:UI.reqTab, reqStage:UI.reqStage, invSec:UI.invSec, prod:UI.prod, jsec:UI.jsec, jsub:UI.jsub, lc:UI.lc, li:UI.li, lq:UI.lq, liq:UI.liq, wsid:UI.wsid});
function pushNav(){
  NAV.push(snap()); if(NAV.length>60) NAV.shift();
  if(HIST){ try{ history.pushState({w:NAV.length}, ''); }catch(e){ HIST=false; } }
}
function popNav(){
  const prev = NAV.pop();
  if(prev) Object.assign(UI, prev); else { UI.tab='home'; UI.cust=null; UI.req=null; }
  closeSheet(); render(); window.scrollTo(0,0);
}
function goBack(){
  if(!NAV.length){ UI.tab='home'; UI.cust=null; UI.req=null; render(); return; }
  if(HIST){ try{ history.back(); return; }catch(e){ HIST=false; } }
  popNav();
}
window.addEventListener('popstate', () => { if(SESSION && (NAV.length || UI.tab!=='home')) popNav(); });

const JSECS = [
  {k:'fikr', n:'التفكر في الخلق', v:'{ ٱلَّذِینَ یَذۡكُرُونَ ٱللَّهَ قِیَـٰمࣰا وَقُعُودࣰا وَعَلَىٰ جُنُوبِهِمۡ وَیَتَفَكَّرُونَ فِی خَلۡقِ ٱلسَّمَـٰوَ ٰ⁠تِ وَٱلۡأَرۡضِ رَبَّنَا مَا خَلَقۡتَ هَـٰذَا بَـٰطِلࣰا سُبۡحَـٰنَكَ فَقِنَا عَذَابَ ٱلنَّارِ }', s:'سُورَةُ آلِ عِمۡرَانَ: ١٩١'},
  {k:'tilawa', n:'تلاوة القرآن', v:'{ وَإِذَا قَرَأۡتَ ٱلۡقُرۡءَانَ جَعَلۡنَا بَیۡنَكَ وَبَیۡنَ ٱلَّذِینَ لَا یُؤۡمِنُونَ بِٱلۡـَٔاخِرَةِ حِجَابࣰا مَّسۡتُورࣰا (٤٥) وَجَعَلۡنَا عَلَىٰ قُلُوبِهِمۡ أَكِنَّةً أَن یَفۡقَهُوهُ وَفِیۤ ءَاذَانِهِمۡ وَقۡرࣰاۚ وَإِذَا ذَكَرۡتَ رَبَّكَ فِی ٱلۡقُرۡءَانِ وَحۡدَهُۥ وَلَّوۡا۟ عَلَىٰۤ أَدۡبَـٰرِهِمۡ نُفُورࣰا (٤٦) }', s:'سُورَةُ الإِسۡرَاءِ'},
  {k:'salah', n:'إقام الصلاة', v:'{ إِنَّنِیۤ أَنَا ٱللَّهُ لَاۤ إِلَـٰهَ إِلَّاۤ أَنَا۠ فَٱعۡبُدۡنِی وَأَقِمِ ٱلصَّلَوٰةَ لِذِكۡرِیۤ (١٤) }', s:'سُورَةُ طه'},
  {k:'tadhkir', n:'فذكّر إنما أنت مذكّر', v:'{ فَذَكِّرۡ إِنَّمَاۤ أَنتَ مُذَكِّرࣱ (٢١) لَّسۡتَ عَلَیۡهِم بِمُصَیۡطِرٍ (٢٢) }', s:'سُورَةُ الغَاشِيَةِ'},
  {k:'dhikr', n:'وذكر الله كثيرًا', v:'{ لَّقَدۡ كَانَ لَكُمۡ فِی رَسُولِ ٱللَّهِ أُسۡوَةٌ حَسَنَةࣱ لِّمَن كَانَ یَرۡجُوا۟ ٱللَّهَ وَٱلۡیَوۡمَ ٱلۡـَٔاخِرَ وَذَكَرَ ٱللَّهَ كَثِیرࣰا }', s:'سُورَةُ الأَحۡزَابِ: ٢١'},
  {k:'kitab', n:'اقرأ كتابك', v:'', s:''}
];
const HIDE_CUST_STAGES = true; // customer stages are hidden for now
const myJ = () => { S.jr ||= {}; return (S.jr[SESSION] ||= {e:[], subs:['الخانة الأولى','الخانة الثانية','الخانة الثالثة','الخانة الرابعة','الخانة الخامسة']}); };
const jSec = k => JSECS.find(x=>x.k===k);
const tfmt = new Intl.DateTimeFormat('ar-u-nu-latn',{hour:'numeric',minute:'2-digit'});
const isToday = iso => iso.slice(0,10)===today();
const PRAYERS = [['fajr','الفجر'],['dhuhr','الظهر'],['asr','العصر'],['maghrib','المغرب'],['isha','العشاء'],['qiyam','قيام الليل']];
const PMAX = PRAYERS.length*5;
const prDay = (d=today()) => { const J=myJ(); J.pr ||= {}; return (J.pr[d] ||= {}); };
const prPts = m => m==='j' || m==='q' ? 5 : m==='f' ? 1 : 0;
const hijri = new Intl.DateTimeFormat('ar-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'});
const wdayF = new Intl.DateTimeFormat('ar',{weekday:'long'});
const isoAdd = (iso,n) => { const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const hijriOf = iso => hijri.format(new Date(isoAdd(iso, S.hAdj ?? -1)+'T12:00:00')).replace(/\s*هـ$/,'');
function weekStart(iso){ const d=new Date(iso+'T12:00:00'); return isoAdd(iso, -d.getDay()); } // week runs Sunday to Saturday
function prWeeks(){
  const J = myJ(); J.pr ||= {};
  const t0 = today(), cur = weekStart(t0);
  const starts = new Set([cur]); Object.keys(J.pr).forEach(d => { if(Object.keys(J.pr[d]).length) starts.add(weekStart(d)); });
  return [...starts].sort().reverse().slice(0,8).map(ws => {
    let sum = 0;
    const rows = [0,1,2,3,4,5,6].map(i => { const d = isoAdd(ws,i); const has = J.pr[d] && Object.keys(J.pr[d]).length;
      const sc = d>t0 ? '' : (has? prScore(d) : 0); if(sc!=='') sum += sc;
      return `<tr class="${d===t0?'tod':''}"><td>${wdayF.format(new Date(d+'T12:00:00'))}</td><td>${hijriOf(d)}</td><td>${sc===''?'':sc+' درجة'}</td></tr>`; }).join('');
    return `<table class="wk"><tbody>${rows}<tr class="sum"><td colspan="2">المجموع${ws===cur?' (هذا الأسبوع)':''}</td><td>${sum} درجة</td></tr></tbody></table>`;
  }).join('');
}
const prScore = (d=today()) => Object.values(prDay(d)).reduce((a,m)=>a+prPts(m),0);
function jCount(sec, sub){
  if(sec==='salah'){ const J=myJ(); J.pr ||= {}; const all=Object.values(J.pr).reduce((a,o)=>a+Object.keys(o).length,0); return {all, day:Object.keys(prDay()).length}; } const e = myJ().e.filter(x=>x.sec===sec && (sub==null || x.sub===sub)); return {all:e.length, day:e.filter(x=>isToday(x.d)).length}; }
function jLog(sec, sub){
  const e = myJ().e.filter(x=>x.sec===sec && (sub==null || x.sub===sub)).slice().reverse();
  return e.length ? `<div class="card"><ul class="timeline">${e.map(x=>`<li>${x.note?esc(x.note):'أنجزت'}<small>${fd(x.d)}، ${tfmt.format(new Date(x.d))}</small></li>`).join('')}</ul></div>`
    : `<div class="empty">لم تسجّل إنجازًا هنا بعد.</div>`;
}
function viewMine(){
  const J = myJ();
  if(UI.jsec){
    const s = jSec(UI.jsec);
    if(s.k==='kitab' && UI.jsub==null){
      const secLine = k => { const x=jSec(k), c=jCount(k); return `<button class="alert" data-act="gojsec" data-v="${k}" style="border-inline-start-color:#029966">
        <div class="grow"><b>${x.n}</b><span class="small muted">اليوم ${c.day} · المجموع ${c.all}</span></div></button>`; };
      return `<h1>${s.n}</h1>
        ${secLine('fikr')}${secLine('tilawa')}
        <div class="card" style="border-inline-start:5px solid #029966">
          <b style="display:block;margin-bottom:6px">إقام الصلاة</b>
          <p class="small muted" style="margin:0 0 8px">مراقبة أداء الصلاة، كل أسبوع وحده.</p>
          ${prWeeks()}
        </div>
        ${secLine('tadhkir')}${secLine('dhikr')}`;
    }
    if(s.k==='salah'){
      const P = prDay(), n = Object.keys(P).length;
      const sq = ([k,nm]) => { const m=P[k]; return `<button class="psq ${m?'done':''}" data-act="pray" data-v="${k}">
        <b>${nm}</b><span>${m? (m==='j'?'جماعة':m==='f'?'فرادى':'تم')+' · '+(prPts(m)===1?'درجة واحدة':prPts(m)+' درجات') : 'اضغط للتسجيل'}</span></button>`; };
      const rows = [[0],[1,2],[3,4,5]];
      return `<h1>${s.n}</h1>
        <div class="verse">${s.v}<small>${s.s}</small></div>
        <div class="pcount"><div><b>${n}</b><span>من ${PRAYERS.length} صلوات اليوم</span></div><div><b>${prScore()}</b><span>من ${PMAX} درجة</span></div></div>
        <div class="pyr">${rows.map(r=>`<div class="prow">${r.map(i=>sq(PRAYERS[i])).join('')}</div>`).join('')}</div>
        <p class="small muted" style="text-align:center">تُسجَّل كل صلاة مرة واحدة في اليوم. الجماعة 5 درجات، والفرادى درجة واحدة، وقيام الليل 5 درجات.</p>`;
    }
    const sub = s.k==='kitab' ? +UI.jsub : null;
    const title = s.k==='kitab' ? J.subs[sub] : s.n;
    const c = jCount(s.k, sub);
    return `<h1>${esc(title)}</h1>
      ${s.v?`<div class="verse">${s.v}<small>${s.s}</small></div>`:''}
      <div class="jstats"><div><b>${c.day}</b><span>اليوم</span></div><div><b>${c.all}</b><span>المجموع</span></div></div>
      <button class="btn block jbtn" data-act="jdone" data-v="${s.k}" data-sub="${sub==null?'':sub}">${I.check} أنجزت</button>
      <h2>سجل الإنجاز</h2>${jLog(s.k, sub)}`;
  }
  return `<h1>رحلتي</h1><p class="small muted" style="margin-top:-6px">متاحة طوال اليوم. سجّل إنجازك في خانته.</p>
    <div class="jgrid">${JSECS.map(s=>{ const c=jCount(s.k); return `<button class="jcard" data-act="gojsec" data-v="${s.k}">
      <b>${s.n}</b><span class="jday">${c.day}</span><span class="jsub">اليوم · المجموع ${c.all}</span></button>`; }).join('')}</div>`;
}

function renderLogin(){

  $('#app').innerHTML = `<div class="login">

      <label class="lfield"><span>كلمة المرور</span><span class="box"><input name="p" type="password" inputmode="numeric" autocomplete="current-password" required><button type="button" class="eye" id="eye">إظهار</button></span></label>
      <button class="lbtn" type="submit">دخول</button>
      <p class="lerr" id="lerr" role="alert"></p>
      ${wsForCheckin().length?`<button type="button" class="cistaff" style="display:block;margin:4px auto 0" data-act="ws_backci">العودة إلى تسجيل الحضور</button>`:''}
    </form></div>
  </div>`;
  const f = $('#lf');
  $('#eye').addEventListener('click', () => { const i=f.p; const show = i.type==='password'; i.type = show?'text':'password'; $('#eye').textContent = show?'إخفاء':'إظهار'; });
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const u = USERS.find(x => normName(x.n)===normName(f.u.value));
    let ok = false;
    try{ ok = !!u && (await sha256('wbnk:'+normDigits(f.p.value)))===u.h; }catch(err){ $('#lerr').textContent='تعذّر التحقق في هذا المتصفح.'; return; }
    if(!ok){ $('#lerr').textContent='اسم المستخدم أو كلمة المرور غير صحيحة.'; f.p.value=''; f.p.focus(); return; }
    SESSION = u.n; try{ localStorage.setItem(SKEY, SESSION); localStorage.removeItem('ws_kiosk'); }catch(err){}
    UI.tab='home'; UI.cust=null; UI.req=null; NAV.length=0; render();

function hpipe(stage, n=LAST, lbl){
  let h = '';
  for(let i=1;i<=n;i++){
    h += `<span class="j ${i<stage?'on':''} ${i===stage?'now':''}"></span>`;
    if(i<n) h += `<span class="seg ${i<stage?'on':''}"></span>`;
  }
  return `<div class="hpipe" aria-label="${lbl||sLabel(stage)}">${h}</div>`;
}

        <span class="grow"><span class="t" style="display:block"><bdi>${esc(p.name)}</bdi></span>
        <span class="s">${[p.barcode&&'باركود '+p.barcode, p.place, p.qty!==''&&'الكمية '+p.qty].filter(Boolean).map(esc).join(' · ')||'—'}</span></span></button>`).join('')}</div>`

function stChip(r){
  if(r.status==='rej') return '<span class="chip bad">مرفوض</span>';
  const m = {new:'amber',recv:'',prog:'',done:'ok'};
  return `<span class="chip ${m[r.status]}">${RST[rIdx(r)].n}</span>`;
}
function reqItem(r){
  const [c] = r.pid ? findP(r.pid) : [null];
  return `<button class="item" data-act="openreq" data-v="${r.id}">
    <span class="grow"><span class="t" style="display:block">${REQ_TYPES[r.type].n}${r.prio==='high'?' <span class="chip bad">عاجل</span>':''}</span>
    <span class="s">${c?'<bdi>'+esc(c.n)+'</bdi>':'بلا مشروع'}${r.eng?' · المهندس: '+esc(r.eng):''}</span></span>${stChip(r)}</button>`;
}
function viewRequests(){
  if(UI.reqStage){
    const i = RST.findIndex(s=>s.k===UI.reqStage);
    const list = S.reqs.filter(r => rIdx(r)===i).sort((a,b)=>b.hist[b.hist.length-1].d.localeCompare(a.hist[a.hist.length-1].d));
    return `<h1>${rLabel(i)} <span class="muted small">(${list.length})</span></h1>
      <p class="small muted" style="margin-top:-6px">${RST[i].cond}</p>
      ${list.length?`<div class="list">${list.map(reqItem).join('')}</div>`:`<div class="empty">لا توجد طلبات في هذه المرحلة.</div>`}
      ${i===0?`<button class="fab" data-act="newreq">${I.plus} طلب جديد</button>`:''}`;
  }
  const counts = RST.map((_,i)=>S.reqs.filter(r=>rIdx(r)===i).length);
  const mx = Math.max(...counts,1);
  const pipe = RST.map((s,i)=>`
    <button class="vstage ${counts[i]?'has':''} ${i===RST.length-1?'last':''}" data-act="goreqstage" data-v="${s.k}">
      <span class="joint">${counts[i]}</span>
      <span class="lbl"><b>${rLabel(i)}</b><i>${s.cond}</i><span class="bar"><i style="width:${Math.round(counts[i]/mx*100)}%"></i></span></span>
    </button>`).join('');
  return `<h1>رحلة الطلب</h1>
    <p class="small muted" style="margin-top:-6px">عدد الطلبات الداخلية في كل مرحلة. اضغط مرحلة لعرض طلباتها.</p>
    <div class="card"><div class="vpipe">${pipe}</div></div>
    <button class="fab" data-act="newreq">${I.plus} طلب جديد</button>`;
}
function viewRequest(){
  const r = S.reqs.find(x=>x.id===UI.req);
  if(!r){ UI.req=null; return viewRequests(); }
  const [c,p] = r.pid ? findP(r.pid) : [null,null];
  const T = REQ_TYPES[r.type];
  const i = rIdx(r), acts = r.acts||[];
  let box = '';
  if(r.status==='new') box = `<div class="notesbox"><b class="small">استلام الطلب</b>
      <input id="eng-${r.id}" class="enginp" placeholder="اسم المهندس المستلم" autocomplete="off">
      <button class="btn amber block" data-act="reqrecv" data-v="${r.id}">تم استلام الطلب</button></div>`;
  else if(r.status==='recv') box = `<button class="btn amber block" data-act="reqnext" data-v="${r.id}">قيد التنفيذ</button>`;
  else if(r.status==='prog') box = `<div class="notesbox"><b class="small">الإجراءات التي قام بها المهندس</b>
      ${acts.map(x=>`<div class="note">${esc(x.txt)}<small>${fd(x.d)}، ${esc(x.by)}</small></div>`).join('')}

  else if(acts.length) box = `<div class="notesbox"><b class="small">الإجراءات التي تمت</b>${acts.map(x=>`<div class="note">${esc(x.txt)}<small>${fd(x.d)}، ${esc(x.by)}</small></div>`).join('')}</div>`;
  return `
    <h1>${T.n}</h1>

      ${hpipe(i+1, RST.length, rLabel(i))}

      <dl class="kv">

        <dt>إلى</dt><dd>${ROLES[r.to].label}</dd>
        ${r.eng?`<dt>المهندس</dt><dd>${esc(r.eng)}</dd>`:''}
        ${r.note?`<dt>التفاصيل</dt><dd>${esc(r.note)}</dd>`:''}
      </dl>
      ${r.items.length?`<h2 style="font-size:.95rem;margin-top:10px">المواد</h2>${r.items.map(it=>{const m=S.mat.find(x=>x.id===it.mid);return `<div class="stat small"><span>${esc(m?m.name:'صنف محذوف')}</span><b style="font-size:.95rem">${it.q} ${m?m.unit:''}</b></div>`}).join('')}`:''}
      ${box}
    </div>
    <h2>مسار الطلب</h2>
    <div class="card"><ul class="timeline">${r.hist.slice().reverse().map(h=>`<li>${h.s==='rej'?'مرفوض':RST[RST.findIndex(s=>s.k===h.s)].n}${h.note?': '+esc(h.note):''}<small>${fd(h.d)}، ${esc(h.by)}</small></li>`).join('')}</ul></div>`;

/* ---------- sheets ---------- */
function sheet(title, inner, onSubmit){
  $('#layer').innerHTML = `<div class="scrim" data-act="closesheet"><form class="sheet" id="sf" role="dialog" aria-label="${esc(title)}"><div class="grab"></div><h3>${esc(title)}</h3>${inner}
    <div class="row" style="margin-top:6px"><button type="submit" class="btn amber grow">حفظ</button><button type="button" class="btn ghost" data-act="closesheet">إلغاء</button></div></form></div>`;
  const f = $('#sf');
  f.addEventListener('submit', e => { e.preventDefault(); const fd_ = Object.fromEntries(new FormData(f)); const ok = onSubmit(fd_, f); if(ok!==false){ closeSheet(); save(); render(); } });
  const first = f.querySelector('input,select,textarea'); if(first) setTimeout(()=>first.focus(),50);
}
function infoSheet(title, inner){
  $('#layer').innerHTML = `<div class="scrim" data-act="closesheet"><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="grab"></div><h3>${esc(title)}</h3>${inner}
    <button type="button" class="btn ghost block" style="margin-top:8px" data-act="closesheet">إغلاق</button></div></div>`;
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast('نُسخ'); return; }catch(e){}
  try{ const i=document.createElement('textarea'); i.value=txt; i.style.position='fixed'; i.style.opacity='0'; document.body.appendChild(i); i.select(); const ok=document.execCommand('copy'); i.remove(); if(ok){ toast('نُسخ'); return; } }catch(e){}
  toast('اضغط مطولًا على النص لنسخه');
}
function contact(c, kind){

    tel:{title:'اتصال بـ '+c.n, show:phoneShow(c.p), url:'tel:'+c.p, go:'اتصال الآن', copy:c.p, copyLbl:'نسخ الرقم'},

    loc:{title:'موقع '+c.n, show:c.loc, url:c.loc, go:'فتح في الخرائط', copy:c.loc, copyLbl:'نسخ الرابط'}

function closeSheet(){ $('#layer').innerHTML=''; }
function toast(t){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2400); }
const cityOptions = sel => { const cs=[...new Set(S.customers.map(c=>c.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar')); return cs.map(c=>`<option ${c===sel?'selected':''}>${esc(c)}</option>`).join(''); };
const log = (p, txt) => p.log.unshift({d:today(), txt, by:R().user});

function advance(pid){
  const [c,p] = findP(pid); const to = p.stage+1; const st = STAGES[to-1];
  { // every transfer is direct: notes are written in each stage's own notes box
    p.stage = to; log(p, 'حُوِّل إلى «'+st.n+'»');
    pushNav(); UI.cust=null; UI.tab='cust'; UI.stageF=String(to); UI.cityF=''; UI.q=''; UI.incF=false;
    save(); render(); window.scrollTo(0,0); toast('حُوِّل '+c.n+' إلى «'+st.n+'»'); return;
  }
  let extra = '';
  if(to===3) extra = `<label class="field"><span>قيمة العقد (ر.ع)</span><input name="value" type="number" min="0" inputmode="numeric" value="${p.value||''}"></label>
    <label class="field"><span>المقدَّم المدفوع عند التوقيع (اختياري)</span><input name="adv" type="number" min="0" inputmode="numeric"></label>`;
  if(to===6){
    const av = S.vac.filter(v=>v.status==='stock');
    if(!av.length){ toast('لا توجد مكانس في المستودع. سجّل استلام مكنسة من قسم المخزون أولًا.'); return; }
    extra = `<label class="field"><span>الرقم التسلسلي للمكنسة</span><select name="sn" required>${av.map(v=>`<option value="${v.sn}">${v.sn} (${esc(v.model)})</option>`).join('')}</select></label>
      <label class="field"><span>تاريخ التركيب</span><input name="date" type="date" value="${today()}" required></label>
      <p class="small muted">${S.warrantyMonths?'سيبدأ احتساب الضمان ('+S.warrantyMonths+' شهرًا) من هذا التاريخ، و':''}تُخصم المكنسة من المخزون.</p>`;
  }
  sheet(`تحويل إلى «${sLabel(to)}»`, `<p style="margin-top:0">${esc(c.n)}<br><span class="small muted">${sCond(to)}</span></p>${extra}
    <label class="field"><span>ملاحظة التحويل (اختياري)</span><textarea name="note" rows="2"></textarea></label>`, d => {
    if(to===3){ if(d.value) p.value = +d.value; if(d.adv) p.pays.push({d:today(),amt:+d.adv,note:'مقدَّم عند توقيع العقد'}); }
    if(to===6){ const v = S.vac.find(x=>x.sn===d.sn); v.status='installed'; v.cid=c.id; v.pid=p.id; p.serial=v.sn; p.install=d.date;
      S.moves.push({d:today(), txt:'تركيب '+v.sn+' لدى '+c.n, by:R().user}); }
    if(d.note && d.note.trim()){ (p.notes ||= []).unshift({s:p.stage, d:today(), txt:'عند التحويل: '+d.note.trim(), by:R().user}); }
    p.stage = to; log(p, 'حُوِّل إلى «'+st.n+'»'+(sCond(to)?': '+sCond(to):''));
    pushNav(); UI.cust=null; UI.tab='cust'; UI.stageF=String(to); UI.cityF=''; UI.q=''; UI.incF=false;
    toast('حُوِّل '+c.n+' إلى «'+st.n+'»');
  });
}

function newRequest(type, pid){
  const pr = []; shownC().forEach(c=>c.projects.forEach(p=>{ if(p.stage>=2 || c.demo) pr.push([p.id, c.n+' ('+p.t+')', c.demo]); }));
  pr.sort((a,b)=>b[2]-a[2]);
  const matOpts = S.mat.map(m=>`<option value="${m.id}">${esc(m.name)} (${m.qty} ${m.unit})</option>`).join('');
  const line = () => `<div class="row"><select name="mid">${matOpts}</select><input name="q" type="number" min="1" inputmode="numeric" placeholder="الكمية"></div>`;
  const inner = `
    <label class="field"><span>نوع الطلب</span><select name="type" id="rtype">${Object.entries(REQ_TYPES).map(([k,v])=>`<option value="${k}" ${k===(type||'gen')?'selected':''}>${v.n}</option>`).join('')}</select></label>
    <label class="field" id="rtoWrap"><span>إلى</span><select name="to">${Object.entries(ROLES).filter(([k])=>k!==role()).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></label>
    <label class="field"><span>المشروع المرتبط (اختياري)</span><select name="pid"><option value="">بلا مشروع</option>${pr.map(x=>`<option value="${x[0]}" ${x[0]===pid?'selected':''}>${esc(x[1])}</option>`).join('')}</select></label>
    <div id="itemsWrap" class="lineitems"><span class="small muted">المواد</span><div id="lines">${line()}</div>
      <button type="button" class="btn ghost" style="min-height:36px;margin-bottom:12px" id="addLine">${I.plus} صنف آخر</button></div>
    <label class="field"><span>الأولوية</span><select name="prio">${Object.entries(PRIO).map(([k,v])=>`<option value="${k}" ${k==='mid'?'selected':''}>${v}</option>`).join('')}</select></label>
    <label class="field"><span>التفاصيل</span><textarea name="note" rows="3" placeholder="ما المطلوب تحديدًا؟"></textarea></label>`;
  sheet('طلب جديد', inner, (d, f) => {
    const t = d.type; const to = REQ_TYPES[t].to || d.to;
    if(to===role() && role()!=='admin'){ toast('لا يمكن إرسال الطلب إلى قسمك نفسه.'); return false; }
    let items = [];
    if(['issue','ret'].includes(t)){
      const mids = f.querySelectorAll('[name=mid]'), qs = f.querySelectorAll('[name=q]');
      mids.forEach((m,i)=>{ const q = +qs[i].value; if(q>0) items.push({mid:m.value,q}); });
      if(!items.length){ toast('أضف صنفًا واحدًا على الأقل بكمية.'); return false; }
    }
    const [c] = d.pid ? findP(d.pid) : [null];
    const r = {id:nid('r'), type:t, from:role(), to, prio:d.prio, cid:c?c.id:'', pid:d.pid||'', items, note:d.note, status:'new', hist:[{s:'new',d:today(),by:R().user}]};
    S.reqs.push(r);
    if(d.pid){ const [,p] = findP(d.pid); log(p, 'أُرسل طلب «'+REQ_TYPES[t].n+'» إلى '+ROLES[to].short); }
    pushNav(); UI.tab='req'; UI.req=null; UI.reqStage='new'; toast('أُرسل الطلب إلى '+ROLES[to].short);
  });
  const sync = () => { const t = $('#rtype').value; $('#itemsWrap').style.display = ['issue','ret'].includes(t)?'':'none'; $('#rtoWrap').style.display = REQ_TYPES[t].to?'none':''; };
  $('#rtype').addEventListener('change', sync); sync();
  $('#addLine').addEventListener('click', () => $('#lines').insertAdjacentHTML('beforeend', line()));
}

function reqNext(id){
  const r = S.reqs.find(x=>x.id===id);
  const order = ['new','recv','prog','done'];
  const nx = order[order.indexOf(r.status)+1];
  if(nx==='done' && !(r.acts||[]).length){ toast('اكتب الإجراءات التي قمت بها أولًا'); return; }
  if(nx==='done' && r.type==='issue'){
    const short = r.items.filter(it => { const m=S.mat.find(x=>x.id===it.mid); return !m || m.qty < it.q; });
    if(short.length){ toast('الكمية المتوفرة لا تكفي لبعض الأصناف.'); return; }
    const [c,p] = r.pid ? findP(r.pid) : [null,null];
    r.items.forEach(it => { const m=S.mat.find(x=>x.id===it.mid); m.qty -= it.q; S.moves.push({d:today(), txt:'صرف '+it.q+' '+m.unit+' '+m.name+(c?' لمشروع '+c.n:''), by:R().user}); });
    if(p) log(p, 'صُرفت المواد: '+r.items.map(it=>{const m=S.mat.find(x=>x.id===it.mid);return it.q+' '+m.unit+' '+m.name}).join('، '));
  }
  if(nx==='done' && r.type==='ret'){
    const [c,p] = r.pid ? findP(r.pid) : [null,null];
    r.items.forEach(it => { const m=S.mat.find(x=>x.id===it.mid); if(m){ m.qty += it.q; S.moves.push({d:today(), txt:'إرجاع '+it.q+' '+m.unit+' '+m.name+(c?' من مشروع '+c.n:''), by:R().user}); } });
    if(p) log(p, 'أُرجعت مواد فائضة إلى المستودع');
  }
  if(nx==='done' && r.pid){ const [,p]=findP(r.pid); if(r.type!=='issue'&&r.type!=='ret') log(p,'أُنجز طلب «'+REQ_TYPES[r.type].n+'»'); }
  r.status = nx; r.hist.push({s:nx, d:today(), by:R().user});
  pushNav(); UI.tab='req'; UI.req=null; UI.reqStage=nx;
  save(); render(); window.scrollTo(0,0); toast('حُوِّل الطلب إلى «'+RST[RST.findIndex(s=>s.k===nx)].n+'»');
}

const SHEET_URL = 'https://script.google.com/macros/s/AKfycbz1mxjIDR0FlXc1tBMX13fdTnY246sWAXDBpG5BRUlQESTVXUwLo7TwwU6WFStt-hjyLg/exec';
const sheetOn = () => !!SHEET_URL && (location.protocol==='http:' || location.protocol==='https:') && !/(^|\.)claude\.ai$/.test(location.hostname);
// push one attendance record to the Sheet (fire-and-forget; local copy already saved)
function sheetPush(rec){
  if(!sheetOn()) return;
  const w = W.ws[rec.w] || {};
  const body = JSON.stringify({ name: PEOPLE[rec.p]||'', day: rec.d, workshop: rec.w, workshopName: w.n||'', p: rec.p, at: rec.at });
  try{
    fetch(SHEET_URL, { method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=utf-8'}, body }).catch(()=>{});
  }catch(e){}
}
// pull all attendance rows from the Sheet and merge into W.att, then refresh
async function sheetPull(){
  if(!sheetOn()) return;
  try{
    const r = await fetch(SHEET_URL, { method:'GET' });
    const j = await r.json();
    if(!j || !j.ok || !Array.isArray(j.rows)) return;
    let changed = false;
    j.rows.forEach(row => {
      let p = (row.p!==undefined && row.p!=='') ? parseInt(row.p,10) : PEOPLE.indexOf(String(row.name||'').trim());
      const wid = row.workshop, d = row.day;
      if(isNaN(p) || p<0 || !wid || !d) return;
      const k = aKey(wid, p, d);
      if(!W.att[k]){ W.att[k] = {w:wid, p, d, at: row.at || row.time || new Date().toISOString()}; changed = true; }
    });
    if(changed){ wLocalSave(); if(!$('#layer').innerHTML) render(); }
  }catch(e){}
}

function wSeed(){
  // one-time backfill: an earlier-created "شذرات" workshop that predates the poster/timing/place fields
  try{
    if(localStorage.getItem('waynak2_ws_backfill')!=='1'){
      const hit = Object.entries(W.ws).find(([id,w]) => (w.n||'').indexOf('شذرات')>=0);
      if(hit && (!hit[1].poster || !hit[1].timing || !hit[1].place)){
        const [id,w] = hit;
        const patched = {...w,
          poster: w.poster || DEFAULT_WS.poster,
          timing: w.timing || DEFAULT_WS.timing,
          place:  w.place  || DEFAULT_WS.place};
        try{ localStorage.setItem('waynak2_ws_backfill','1'); }catch(e){}
        try{ localStorage.setItem('waynak2_ws_seed','1'); }catch(e){}
        wPut('ws', id, patched).catch(()=>{});
        return;
      }
      try{ localStorage.setItem('waynak2_ws_backfill','1'); }catch(e){}
    }
  }catch(e){}
  try{ if(localStorage.getItem('waynak2_ws_seed')==='1') return; }catch(e){}
  if(Object.keys(W.ws).length){ try{ localStorage.setItem('waynak2_ws_seed','1'); }catch(e){} return; }
  const {id, ...data} = DEFAULT_WS;
  try{ localStorage.setItem('waynak2_ws_seed','1'); }catch(e){}
  wPut('ws', id, data).catch(()=>{});
}

const an = s => normName(s).replace(/[\u064B-\u0652\u0670]/g,'').replace(/ة/g,'ه').replace(/ى/g,'ي');
const ldate = (d=new Date()) => { const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); };
const ldParse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const fdl = s => s ? dfmt.format(ldParse(s)) : '—';
const wkday = new Intl.DateTimeFormat('ar',{weekday:'long'});
const dg = n => n+' '+(n>=3&&n<=10&&Number.isInteger(+n)?'درجات':'درجة');
const CUTOFF_ON = false; // اجعلها true لإعادة إغلاق التسجيل الساعة 12 ظهرًا
const pastNoon = () => CUTOFF_ON && new Date().getHours() >= CUTOFF_H;
function wDays(w){
  const out = new Set();
  (w.ranges||[]).forEach(r => { if(!r.f) return; const d = ldParse(r.f), e = ldParse(r.t && r.t>=r.f ? r.t : r.f); let g=0;
    while(d<=e && g++<400){ out.add(ldate(d)); d.setDate(d.getDate()+1); } });
  return [...out].sort();
}
const wList = () => Object.entries(W.ws).map(([id,w]) => ({id, ...w})).sort((a,b) => (wDays(b)[0]||'').localeCompare(wDays(a)[0]||''));
const wGet = id => W.ws[id] ? {id, ...W.ws[id]} : null;
const aKey = (wid,p,d) => wid+'__'+p+'__'+d;
const eKey = (wid,p) => wid+'__'+p;
const hasAtt = (wid,p,d) => !!W.att[aKey(wid,p,d)];
const attDays = (w,p) => wDays(w).filter(d => hasAtt(w.id,p,d));
const attScore = (w,p) => Math.min(ATT_MAX, attDays(w,p).length*ATT_PTS);
const examOf = (w,p) => W.exam[eKey(w.id,p)] || null;
const lastDay = w => { const d = wDays(w); return d[d.length-1]; };
const wsToday = () => wList().filter(w => wDays(w).includes(ldate()));
function wsForCheckin(){
  const list = wList(); if(!list.length) return [];
  const today = wsToday(); if(today.length) return today;
  const t = ldate();
  const upcoming = list.filter(w => { const d=wDays(w); return d.length && t < d[0]; })
                       .sort((a,b) => wDays(a)[0] < wDays(b)[0] ? -1 : 1);
  if(upcoming.length) return [upcoming[0]];
  const past = list.filter(w => wDays(w).length)
                   .sort((a,b) => { const A=wDays(a), B=wDays(b); return A[A.length-1] > B[B.length-1] ? -1 : 1; });
  return past.length ? [past[0]] : [];
}
const qTotal = w => (w.qs||[]).reduce((a,q) => a+(+q.p||0), 0);
const quizPending = (w,p) => ldate()===lastDay(w) && (w.qs||[]).length>0 && !examOf(w,p);
function wStatus(w){ const d=wDays(w), t=ldate(); if(!d.length) return ['gray','بلا تاريخ'];
  if(t<d[0]) return ['amber','قادمة']; if(t>d[d.length-1]) return ['gray','منتهية']; return ['ok', d.includes(t)?'اليوم':'جارية']; }
const rangesText = w => (w.ranges||[]).filter(r=>r.f).map(r => r.t && r.t!==r.f ? 'من '+fdl(r.f)+' إلى '+fdl(r.t) : fdl(r.f)).join('، ') || '—';
const wMonthFmt = new Intl.DateTimeFormat('ar',{month:'long',year:'numeric'});
function wMonthLabel(w){ const d = wDays(w); if(!d.length) return '—';
  const a = ldParse(d[0]), b = ldParse(d[d.length-1]);
  return (a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear()) ? wMonthFmt.format(a) : wMonthFmt.format(a)+' — '+wMonthFmt.format(b); }

/* storage: shared db when the page runs published, this device otherwise */
function wLocalSave(){ if(WS_MODE!=='local') return; try{ localStorage.setItem(WLS, JSON.stringify(W)); }catch(e){ toast('تعذّر الحفظ: مساحة التخزين في الجهاز ممتلئة'); } }
function wLocalLoad(){ try{ const o = JSON.parse(localStorage.getItem(WLS)||'null'); if(o) for(const k in W) W[k] = o[k]||{}; }catch(e){} }
async function wPut(col, id, data){
  const prev = W[col][id]; W[col][id] = data;
  if(col==='att') sheetPush(data);

async function wInit(){

  const maxTries = onClaude ? 15 : 3;
  let tries = 0; while(!(window.claude && typeof window.claude.use==='function') && tries++ < maxTries) await new Promise(r=>setTimeout(r,100));
  let db = null;
  try{ if(window.claude && typeof window.claude.use==='function') db = await window.claude.use('db'); }catch(e){ db = null; }
  if(!db){ WS_MODE='local'; wLocalLoad(); WS_READY=true; wSeed(); render();
    if(sheetOn()){ sheetPull(); setInterval(() => { if(SESSION && UI.tab==='inv' && !$('#layer').innerHTML) sheetPull(); }, 20000); }
    return; }
  DB = db; WS_MODE = 'db'; const seen = new Set();
  const ready = (seeded) => { if(!WS_READY){ WS_READY=true; if(seeded) wSeed(); render(); } };
  ['ws','att','prof','exam'].forEach(col => {
    db.collection(col).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { if(d.exists) m[d.id] = d.data(); }); W[col] = m;
      seen.add(col); if(!WS_READY){ if(seen.size>=4) ready(true); } else wSoft();

}

function compressImg(file){
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      let max = 1100, q = .82, out = '';
      for(let k=0; k<8; k++){ const sc = Math.min(1, max/Math.max(img.width, img.height)); const cv = document.createElement('canvas');
        cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc); const cx = cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height);
        cx.drawImage(img, 0, 0, cv.width, cv.height); out = cv.toDataURL('image/jpeg', q); if(out.length < 190000) break; q = Math.max(.45, q-.1); max = Math.round(max*.85); }
      res(out); }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

    <div class="field"><span>أيام الحضور (${ATT_PTS} درجات لكل يوم)</span>
      ${days.map(d => { const a = W.att[aKey(w.id,p,d)]; return `<label class="row small dayck"><input type="checkbox" name="d" value="${d}" ${a?'checked':''}>
        <span class="grow">${wkday.format(ldParse(d))} ${fdl(d)}</span><span class="muted">${a&&a.at?'سجّل '+new Date(a.at).toLocaleTimeString('ar-u-nu-latn',{hour:'numeric',minute:'2-digit'}):(d<t||(d===t&&pastNoon()))?'غائب':''}</span></label>`; }).join('')}</div>
    <label class="field"><span>درجة الاختبار (من 75)${ex&&ex.ans?` · الدرجة التلقائية ${ex.auto}`:''}</span><input name="ex" type="number" min="0" max="75" step="0.5" inputmode="decimal" value="${ex?esc(ex.score):''}" placeholder="لم يُختبر بعد"></label>
    ${ex&&ex.ans?`<p class="small muted" style="margin-top:-6px">أرسل إجاباته ${new Date(ex.at).toLocaleString('ar-u-nu-latn',{dateStyle:'medium',timeStyle:'short'})}. إفراغ الخانة يحذف الاختبار ويتيح إعادته.</p>`:''}`, (d, f) => {

      if(m!==(pr.m||'') || ph!==(pr.ph||'')) jobs.push(m||ph ? wPut('prof','p'+p,{m, ph}) : wDel('prof','p'+p));

}

/* ---------- actions ---------- */
async function wsAct(a, v, el){
  const w = UI.wsid ? wGet(UI.wsid) : null;
  if(a==='ws_open'){ pushNav(); UI.tab='inv'; UI.wsid=v; render(); window.scrollTo(0,0); }
  else if(a==='ws_new') wsSheet(null);
  else if(a==='ws_edit' && w) wsSheet(w);
  else if(a==='ws_radd') $('#wranges').insertAdjacentHTML('beforeend', rline({}));
  else if(a==='ws_rdel'){ if(document.querySelectorAll('.wrange').length>1) el.closest('.wrange').remove(); else toast('لا بد من تاريخ واحد على الأقل'); }
  else if(a==='ws_prm'){ $('#wposter').value=''; $('#wpv').innerHTML=''; el.hidden = true; }
  else if(a==='ws_del' && w){
    if(!confirm('حذف ورشة «'+w.n+'» مع سجلات حضورها ودرجاتها؟ لا يمكن التراجع.')) return;
    const pre = w.id+'__';
    try{ for(const col of ['att','exam']) for(const k of Object.keys(W[col])) if(k.startsWith(pre)) await wDel(col,k); await wDel('ws', w.id); }catch(e){}
    UI.wsid=null; NAV.length=0; toast('حُذفت الورشة'); render();
  }
  else if(a==='ws_quiz' && w) wsQuiz(w);
  else if(a==='ws_qadd' && w) wsQSheet(w, null);
  else if(a==='ws_qedit' && w) wsQSheet(w, +v);
  else if(a==='ws_qdel' && w){ if(!confirm('حذف هذا السؤال؟')) return; const qs=[...(w.qs||[])]; qs.splice(+v,1); const {id,...rest}=w;
    try{ await wPut('ws', id, {...rest, qs}); }catch(e){} wsQuiz(wGet(id)); }
  else if(a==='ws_row' && w) wsRow(w, +v);
  else if(a==='ws_qr') wsQR();
  else if(a==='ws_kiosk'){
    if(!confirm('سيتحول هذا الجهاز إلى جهاز تسجيل حضور يستعمله المشاركون واحدًا بعد آخر، وستخرج من حسابك. للعودة اضغط «دخول الموظفين» أسفل الصفحة وأدخل كلمة المرور. متابعة؟')) return;
    try{ localStorage.setItem('ws_kiosk','1'); localStorage.removeItem(SKEY); }catch(e){}
    SESSION=null; NAV.length=0; UI.tab='home'; UI.staffLogin=false; closeSheet(); CI={step:'name', q:'', p:null, wid:UI.wsid, again:false}; render();
  }
  /* participant side */
  else if(a==='ws_staff'){ UI.staffLogin=true; render(); }
  else if(a==='ws_backci'){ UI.staffLogin=false; render(); }
  else if(a==='ws_ciw'){ CI.wid=v; render(); }
  else if(a==='ws_cipick'){ const cw = wGet(CI.wid); CI.p=+v;
    if(cw && hasAtt(cw.id, CI.p, ldate())){ CI.again=true; CI.step = quizPending(cw, CI.p) ? 'quizoffer' : 'done'; }
    else CI.step='form';
    render(); window.scrollTo(0,0); }
  else if(a==='ws_cichg'){ ciReset(); render(); }
  else if(a==='ws_cinext'){ clearTimeout(ciTimer); ciReset(); render(); }
  else if(a==='ws_present'){
    const cw = wGet(CI.wid), p = CI.p, d = ldate(); if(!cw || p==null) return;
    const isDay = wDays(cw).includes(d);
    if(isDay && pastNoon()){ render(); return; }
    el.disabled = true; el.textContent = 'جارٍ التسجيل…';
    try{
      if(isDay && !hasAtt(cw.id,p,d)) await wPut('att', aKey(cw.id,p,d), {w:cw.id, p, d, at:new Date().toISOString()});
    }catch(e){ el.disabled=false; el.textContent = 'تسجيل حضور'; return; }
    CI.again=false; CI.step = (isDay && quizPending(cw,p)) ? 'quiz' : 'done'; render(); window.scrollTo(0,0); ciAutoNext();
  }
  else if(a==='ws_quizstart'){ CI.step='quiz'; render(); window.scrollTo(0,0); }
  else if(a==='ws_quizsend'){
    const cw = wGet(CI.wid), p = CI.p; if(!cw || p==null) return;
    if(examOf(cw,p)){ CI.step='sent'; render(); return; }
    const qs = cw.qs||[]; const ans = qs.map((_,i) => { const r = document.querySelector('input[name=qa'+i+']:checked'); return r ? +r.value : -1; });
    const miss = ans.filter(x => x<0).length;
    if(miss && !confirm('لم تُجب عن '+miss+' '+(miss===1?'سؤال':'أسئلة')+'. هل تريد الإرسال على هذه الحال؟')) return;
    const auto = qs.reduce((s,q,i) => s + (ans[i]===q.c ? (+q.p||0) : 0), 0);
    el.disabled = true; el.textContent = 'جارٍ الإرسال…';
    try{ await wPut('exam', eKey(cw.id,p), {w:cw.id, p, ans, auto, score:Math.min(EXAM_MAX, auto), at:new Date().toISOString()}); }
    catch(e){ el.disabled=false; el.textContent='إرسال'; return; }
    CI.step='sent'; render(); window.scrollTo(0,0); ciAutoNext();
  }
}

      <label class="field"><span>الرقم التسلسلي</span><input name="sn" class="ltr" required placeholder="مثال: VB-1234"></label>
      <label class="field"><span>تاريخ التركيب</span><input name="date" type="date" required></label>`, d => {
      p.serial=d.sn.trim(); p.install=d.date; S.vac.push({sn:p.serial, model:'غير محدد (سجل قديم)', status:'installed', cid:c.id, pid:p.id, recv:d.date});
      log(p,'أُضيفت بيانات التركيب: '+p.serial); toast('حُفظت بيانات التركيب'); });
    return;
  }
  else if(a==='setloc'){
    const c = findC(v);
    sheet('موقع الزبون', `<label class="field"><span>رابط الموقع من خرائط جوجل</span><input name="loc" type="url" class="ltr" required placeholder="https://maps.app.goo.gl/..."></label>`, d => { c.loc=d.loc.trim(); toast('حُفظ الموقع'); });
    return;
  }
  else if(a==='newcust'){
    sheet('زبون جديد', `<p class="small" style="margin-top:0;padding:10px 12px;border-radius:10px;background:var(--amber-soft)">يُسجَّل كل زبون جديد في المرحلة الأولى «زبون» دائمًا، ثم ينتقل بين المراحل خطوة خطوة حسب شرط كل مرحلة.</p><label class="field"><span>الاسم</span><input name="n" required></label>
      <label class="field"><span>الهاتف</span><input name="p" type="tel" class="ltr" inputmode="tel" placeholder="9xxxxxxx"></label>
      <label class="field"><span>المدينة</span><select name="c"><option value="">اختر المدينة</option>${cityOptions()}</select></label>
      <label class="field"><span>نوع المبنى</span><select name="ty"><option>منزل</option><option>مسجد</option><option>مجلس</option><option>مبنى تجاري</option></select></label>`, d => {
      let ph = d.p.replace(/\D/g,''); if(ph.length===8) ph='968'+ph; ph = ph?'+'+ph:'';
      if(ph && shownC().some(c=>c.p===ph)){ const ex=shownC().find(c=>c.p===ph); toast('الرقم مسجَّل لـ '+ex.n+'. أضف له مشروعًا جديدًا بدل تكرار الزبون.'); pushNav(); UI.tab='cust'; UI.cust=ex.id; closeSheet(); render(); return false; }
      const c = {id:nid('c'), n:d.n.trim(), p:ph, a:'', c:d.c, ar:'', e:'', nt:'', loc:'', demo:false,
        projects:[{id:nid('p'), t:d.ty+' '+d.n.trim().split(' ')[0], ty:d.ty, stage:1, value:null, pays:[], serial:'', install:'', notes:[], log:[{d:today(),txt:'سُجّل زبونًا',by:R().user}]}]};
      S.customers.unshift(c); pushNav(); UI.cust=c.id; UI.stageF='1'; UI.cityF=''; UI.q=''; UI.incF=false; toast('سُجّل الزبون في مرحلة «زبون»'); });
    return;
  }
  else if(a==='delproj'){
    const [c,p] = findP(v); if(!p || p.stage!==1) return;
    const only = c.projects.length===1;
    sheet(only?'حذف الزبون':'حذف المشروع', `<p style="margin-top:0">${only?`سيُحذف <b><bdi>${esc(c.n)}</bdi></b> وكل ملاحظاته نهائيًا.`:`سيُحذف مشروع <b><bdi>${esc(p.t)}</bdi></b> من مشاريع <b><bdi>${esc(c.n)}</bdi></b>، وتبقى مشاريعه الأخرى.`} لا يمكن التراجع عن الحذف.</p>
      <label class="row small" style="margin-bottom:12px"><input type="checkbox" name="ok" required> نعم، أريد الحذف</label>`, d => {
      if(only){ S.customers = S.customers.filter(x=>x.id!==c.id); S.reqs = S.reqs.filter(r=>r.cid!==c.id); }
      else { c.projects = c.projects.filter(x=>x.id!==p.id); S.reqs = S.reqs.filter(r=>r.pid!==p.id); }
      if(UI.cust){ UI.cust=null; } toast(only?'حُذف الزبون':'حُذف المشروع'); });
    const sb = document.querySelector('#sf button[type=submit]'); sb.textContent='حذف'; sb.className='btn bad grow';
    return;
  }
  else if(a==='delcust'){
    const c = findC(v); if(!c || !editable(c)) return;
    sheet('حذف الزبون', `<p style="margin-top:0">سيُحذف <b><bdi>${esc(c.n)}</bdi></b> وكل ملاحظاته نهائيًا. لا يمكن التراجع عن الحذف.</p>
      <label class="row small" style="margin-bottom:12px"><input type="checkbox" name="ok" required> نعم، أريد حذف هذا الزبون</label>`, d => {
      S.customers = S.customers.filter(x => x.id!==c.id); S.reqs = S.reqs.filter(r => r.cid!==c.id);
      UI.cust=null; toast('حُذف الزبون'); });
    const sb = document.querySelector('#sf button[type=submit]'); sb.textContent='حذف'; sb.className='btn bad grow';
    return;
  }
  else if(a==='editcust'){
    if(!editable(findC(v))) return;
    const c = findC(v);
    sheet('تعديل بيانات الزبون', `<label class="field"><span>الاسم</span><input name="n" required value="${esc(c.n==='زبون بلا اسم'?'':c.n)}"></label>
      <label class="field"><span>الهاتف</span><input name="p" type="tel" class="ltr" inputmode="tel" value="${esc(c.p)}" placeholder="9xxxxxxx"></label>
      <label class="field"><span>المدينة</span><select name="c"><option value="">اختر المدينة</option>${cityOptions(c.c)}</select></label>
      <label class="field"><span>البريد (اختياري)</span><input name="e" type="email" class="ltr" value="${esc(c.e)}"></label>`, d => {
      let ph = d.p.replace(/\D/g,''); if(ph.length===8) ph='968'+ph; ph = ph?'+'+ph:'';
      const dup = ph && S.customers.find(x=>x.p===ph && x.id!==c.id);
      if(dup){ toast('الرقم مسجَّل لـ '+dup.n); return false; }
      c.n=d.n.trim(); c.p=ph; c.c=d.c; c.e=d.e.trim(); c.projects.forEach(p=>log(p,'عُدّلت بيانات الزبون')); toast('حُفظت البيانات'); });
    return;
  }
  else if(a==='newproj'){
    const c = findC(v);
    sheet('مشروع جديد لـ '+c.n, `<label class="field"><span>اسم المشروع</span><input name="t" required placeholder="مثال: المجلس، البيت الجديد"></label>
      <label class="field"><span>نوع المبنى</span><select name="ty"><option>منزل</option><option>مسجد</option><option>مجلس</option><option>مبنى تجاري</option></select></label>`, d => {
      c.projects.unshift({id:nid('p'), t:d.t, ty:d.ty, stage:1, value:null, pays:[], serial:'', install:'', notes:[], log:[{d:today(),txt:'أُضيف مشروع جديد للزبون',by:R().user}]}); toast('أُضيف المشروع'); });
    return;
  }
  else if(a==='newmat'){
    sheet('صنف جديد في مواد البناء', `<label class="field"><span>اسم الصنف</span><input name="name" required></label>
      <div class="row"><label class="field grow"><span>الوحدة</span><input name="unit" required placeholder="قطعة، متر"></label><label class="field grow"><span>الكمية الحالية</span><input name="qty" type="number" min="0" required></label></div>
      <label class="field"><span>الحد الأدنى للتنبيه</span><input name="min" type="number" min="0" required></label>`, d => {
      S.mat.push({id:nid('m'), name:d.name, unit:d.unit, qty:+d.qty, min:+d.min}); S.moves.push({d:today(),txt:'إضافة صنف جديد: '+d.name+' ('+d.qty+' '+d.unit+')',by:R().user}); toast('أُضيف الصنف'); });
    return;
  }
  else if(a==='receive'){
    const m = S.mat.find(x=>x.id===v);
    sheet('استلام كمية: '+m.name, `<label class="field"><span>الكمية المستلمة (${m.unit})</span><input name="q" type="number" min="1" required></label>
      <label class="field"><span>المورِّد (اختياري)</span><input name="sup"></label>`, d => {
      m.qty += +d.q; S.moves.push({d:today(),txt:'استلام '+d.q+' '+m.unit+' '+m.name+(d.sup?' من '+d.sup:''),by:R().user}); toast('أُضيفت الكمية'); });
    return;
  }
  else if(a==='newvac'){
    sheet('استلام مكنسة', `<label class="field"><span>الرقم التسلسلي</span><input name="sn" class="ltr" required></label>
      <label class="field"><span>الطراز</span><input name="model" required placeholder="اسم الطراز كما هو لديكم"></label>`, d => {
      const sn = d.sn.trim(); if(S.vac.some(x=>x.sn===sn)){ toast('هذا الرقم التسلسلي مسجَّل مسبقًا.'); return false; }
      S.vac.unshift({sn, model:d.model, status:'stock', cid:'', pid:'', recv:today()}); S.moves.push({d:today(),txt:'استلام مكنسة '+sn,by:R().user}); toast('سُجّلت المكنسة'); });
    return;
  }
  else if(a==='settings'){
    sheet('الإعدادات', `
      ${role()==='admin'?`<label class="field"><span>مدة ضمان المكنسة (بالأشهر)</span><input name="w" type="number" min="1" value="${S.warrantyMonths||''}" placeholder="لم تُحدَّد"></label>`:'<p class="small muted">تعديل مدة الضمان من صلاحية الإدارة.</p>'}
      <p class="small" style="margin-top:0">المستخدم الحالي: <b>${esc(SESSION)}</b></p>
      <button type="button" class="btn bad block" style="margin-bottom:14px" data-act="logout">تسجيل الخروج</button>
      <p class="small muted">هذا نموذج أولي: التعديلات محفوظة على هذا الجهاز فقط، والزبائن المعلَّمون «تجريبي» للتوضيح وليسوا من ملفك.</p>
      <label class="field"><span>تعديل التاريخ الهجري (بالأيام)</span><select name="hadj">${[-2,-1,0,1,2].map(n=>`<option value="${n}" ${(S.hAdj ?? -1)===n?'selected':''}>${n>0?'+'+n:n}</option>`).join('')}</select></label>
      <label class="row small" style="margin-bottom:12px"><input type="checkbox" name="imp" ${S.showImp?'checked':''}> إظهار زبائن أودو المستوردين (${S.customers.filter(c=>c.imp).length})</label>
      <label class="row small" style="margin-bottom:12px"><input type="checkbox" name="reset"> إعادة البيانات إلى حالتها الأولى</label>`, d => {
      if(d.reset){ const r=S.role; S=seed(); S.role=r; UI={...UI,cust:null,req:null}; toast('أُعيدت البيانات'); return; }
      S.showImp = !!d.imp; S.hAdj = +d.hadj; if(d.w) S.warrantyMonths = Math.max(1,+d.w); toast('حُفظت الإعدادات'); });
    return;
  }
  render(); window.scrollTo(0,0);
});
document.addEventListener('change', e => {
  const k = e.target.dataset.change; if(!k) return;
  if(k==='role'){ S.role = e.target.value; UI.cust=null; UI.req=null; UI.reqTab='in'; save(); toast('أنت الآن: '+R().label); }
  else UI[k] = e.target.value;
  render();
});
document.addEventListener('input', e => {
  const k = e.target.dataset.input; if(k){ UI[k] = e.target.value; const pos = e.target.selectionStart; render(); const s=document.querySelector('[data-input="'+k+'"]'); if(s){ s.focus(); try{s.setSelectionRange(pos,pos);}catch(_){} } }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); });
render();
</script>
</body>
</html>
